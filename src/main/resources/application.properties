# H2 数据库配置
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 自动建表
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 控制台（可选，访问 /h2-console）
spring.h2.console.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false

# Platform authentication
platform.auth.douyin-app-key=${DOUYIN_APP_KEY:default_douyin_key}
platform.auth.douyin-app-secret=${DOUYIN_APP_SECRET:default_douyin_secret}
platform.auth.pdd-client-id=${PDD_CLIENT_ID:default_pdd_id}
platform.auth.pdd-client-secret=${PDD_CLIENT_SECRET:default_pdd_secret}

# Rate limiting
platform.rate-limit.douyin-requests-per-second=10
platform.rate-limit.pdd-requests-per-second=5