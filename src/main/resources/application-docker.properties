spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/multishop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# Logging
logging.level.org.springframework=INFO

# Platform authentication
platform.auth.douyin-app-key=${DOUYIN_APP_KEY:default_douyin_key}
platform.auth.douyin-app-secret=${DOUYIN_APP_SECRET:default_douyin_secret}
platform.auth.pdd-client-id=${PDD_CLIENT_ID:default_pdd_id}
platform.auth.pdd-client-secret=${PDD_CLIENT_SECRET:default_pdd_secret}

# Rate limiting
platform.rate-limit.douyin-requests-per-second=10
platform.rate-limit.pdd-requests-per-second=5