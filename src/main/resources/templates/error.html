<!-- src/main/resources/templates/error.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Error</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; padding: 2rem; }
        .card { border: 1px solid #ddd; padding: 1.5rem; border-radius: 6px; background:#fff }
        h1 { margin-top: 0 }
        a { color: #0066cc }
    </style>
</head>
<body>
    <div class="card">
        <h1 th:text="${status} + ' - ' + ${error}">Error</h1>
        <p th:text="${message}">Something went wrong.</p>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
